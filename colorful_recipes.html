<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Web Showcase</title>
<meta name="description" content="Web pages built by students in our computer science classes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5fb;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #4a5878;
    --line: #cfd7e8;
    --accent: #2b55e0;
    --accent-ink: #ffffff;
    --highlight: #ffd23f;
    --frame: #e4e9f5;
    --focus: #14213d;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a33;
      --surface: #172445;
      --ink: #eef2fb;
      --muted: #aab6d3;
      --line: #2d3d66;
      --accent: #7f9bff;
      --accent-ink: #0f1a33;
      --highlight: #ffd23f;
      --frame: #22335c;
      --focus: #ffd23f;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 1.125rem;
    line-height: 1.55;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }

  /* Header */
  header { padding: 3.5rem 0 2rem; }
  h1 {
    font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 7vw, 4.4rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
    max-width: 14ch;
  }
  h1 .mark {
    background: linear-gradient(transparent 58%, var(--highlight) 58% 92%, transparent 92%);
    padding: 0 0.1em;
  }
  .intro { max-width: 58ch; color: var(--muted); margin: 0; }

  /* Filters */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem;
    padding: 1rem 0 1.5rem;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .filters button {
    font: inherit; font-weight: 700;
    border: 2px solid var(--ink);
    background: transparent; color: var(--ink);
    padding: 0.4rem 1rem; border-radius: 999px; cursor: pointer;
  }
  .filters button:hover { background: var(--frame); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .count { color: var(--muted); margin-left: auto; }

  /* Grid */
  .grid {
    list-style: none; margin: 0; padding: 0 0 4rem;
    display: grid; gap: 1.75rem;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  }
  .card { margin: 0; }
  .card a.open {
    display: block; text-decoration: none;
    background: var(--surface);
    border: 2px solid var(--ink);
    border-radius: 14px 14px 6px 6px;
    overflow: hidden;
  }
  .card a.open:hover .title { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .card a.open:hover { border-color: var(--accent); }

  /* Browser frame: it's a web page, so it looks like one */
  .bar {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--frame); padding: 0.45rem 0.7rem;
    border-bottom: 2px solid var(--ink);
  }
  .bar i { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--muted); opacity: 0.55; }
  .bar span {
    margin-left: 0.5rem; font-size: 0.8rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .shot { position: relative; aspect-ratio: 16 / 10; background: #fff; overflow: hidden; }
  .shot iframe {
    position: absolute; top: 0; left: 0;
    width: 1280px; height: 800px; border: 0;
    transform-origin: top left;
    pointer-events: none; background: #fff;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800; font-size: 4rem; color: var(--ink);
    background: var(--hue, var(--highlight));
  }

  .info { padding: 0.9rem 1rem 1.1rem; }
  .title {
    font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
    font-weight: 800; font-size: 1.35rem; line-height: 1.2; margin: 0 0 0.2rem;
  }
  .by { margin: 0 0 0.5rem; color: var(--muted); font-size: 1rem; }
  .desc { margin: 0 0 0.75rem; font-size: 1rem; }
  .tag {
    display: inline-block; font-size: 0.875rem; font-weight: 700;
    padding: 0.1rem 0.6rem; border-radius: 6px;
    background: var(--highlight); color: #14213d;
  }

  .empty { padding: 3rem 0 5rem; color: var(--muted); }
  .empty[hidden] { display: none; }

  footer { border-top: 2px solid var(--line); padding: 1.5rem 0 3rem; color: var(--muted); font-size: 1rem; }
  footer p { margin: 0 0 0.4rem; max-width: 70ch; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Built by <span class="mark">students</span></h1>
    <p class="intro">
      Web pages made by students in our computer science classes.
      Select a page to open it in a new tab.
    </p>
  </div>
</header>

<main class="wrap" id="main">
  <div class="toolbar">
    <div class="filters" id="filters" role="group" aria-label="Filter by class"></div>
    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <ul class="grid" id="grid"></ul>

  <p class="empty" id="empty" hidden>No pages in this class yet. Check back soon.</p>
</main>

<footer>
  <div class="wrap">
    <p>Student work is shared with permission. Pages open in a new tab and are not controlled by this site.</p>
    <p id="credit"></p>
  </div>
</footer>

<script>
/* ============================================================
   TEACHER: EDIT THIS SECTION
   ------------------------------------------------------------
   To add a student page:
   1. Put the student's folder in this repo, for example:
        students/maria/index.html
   2. Copy one line below, paste it, and change the values.

   title        Name of the page
   student      First name and last initial only (ex: "Maria G.")
   course       Must match a name in COURSES below
   description  One short sentence (optional)
   url          Path to the page, relative to this file
   thumb        Optional screenshot, for example "students/maria/shot.png".
                If you leave it out, the page shows as a live preview.
   preview      Set to false to show a colored tile instead of a live
                preview (good for pages that are slow or use big files).
   ============================================================ */

const SITE_CREDIT = "Computer Science, Your School Name";

const COURSES = [
  "CS Principles"
];

const PROJECTS = [
  {
    title: "Example: My Favorite Place",
    student: "Student A.",
    course: "CS Principles",
    description: "Delete this line and add a real student page.",
    url: "students/example-a/index.html",
    preview: false
  },
  {
    title: "Example: Class Photo Gallery",
    student: "Student B.",
    course: "CS Principles",
    description: "Delete this line and add a real student page.",
    url: "students/example-b/index.html",
    preview: false
  }
];

/* ============================================================
   END OF EDIT SECTION. You should not need to change anything below.
   ============================================================ */

const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
document.getElementById("credit").textContent = SITE_CREDIT;

const HUES = ["#ffd23f", "#8fe3cf", "#ffb4a2", "#b8c7ff", "#d6f28b"];
let active = "All";

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  children.forEach(c => node.appendChild(c));
  return node;
}

function buildShot(p, i) {
  const shot = el("div", { class: "shot" });
  if (p.thumb) {
    shot.appendChild(el("img", { src: p.thumb, alt: "Screenshot of " + p.title, loading: "lazy" }));
  } else if (p.preview === false) {
    const ph = el("div", { class: "placeholder", "aria-hidden": "true", text: (p.title.replace(/^Example:\s*/, "")[0] || "?").toUpperCase() });
    ph.style.setProperty("--hue", HUES[i % HUES.length]);
    shot.appendChild(ph);
  } else {
    shot.appendChild(el("iframe", {
      src: p.url,
      title: "Preview of " + p.title,
      loading: "lazy",
      sandbox: "allow-scripts",
      tabindex: "-1",
      "aria-hidden": "true"
    }));
  }
  return shot;
}

function buildCard(p, i) {
  const bar = el("div", { class: "bar", "aria-hidden": "true" }, [
    el("i"), el("i"), el("i"), el("span", { text: p.url })
  ]);
  const info = el("div", { class: "info" }, [
    el("h2", { class: "title", text: p.title }),
    el("p", { class: "by", text: "by " + p.student })
  ]);
  if (p.description) info.appendChild(el("p", { class: "desc", text: p.description }));
  info.appendChild(el("span", { class: "tag", text: p.course }));

  const link = el("a", {
    class: "open", href: p.url, target: "_blank", rel: "noopener",
    "aria-label": p.title + " by " + p.student + ". Opens in a new tab."
  }, [bar, buildShot(p, i), info]);

  const li = el("li", { class: "card", "data-course": p.course }, [link]);
  return li;
}

function scalePreviews() {
  document.querySelectorAll(".shot iframe").forEach(f => {
    const w = f.parentElement.clientWidth;
    if (w) f.style.transform = "scale(" + (w / 1280) + ")";
  });
}

function render() {
  const cards = grid.querySelectorAll(".card");
  let shown = 0;
  cards.forEach(c => {
    const match = active === "All" || c.dataset.course === active;
    c.hidden = !match;
    if (match) shown++;
  });
  countEl.textContent = shown + (shown === 1 ? " page" : " pages");
  emptyEl.hidden = shown !== 0;
  requestAnimationFrame(scalePreviews);
}

function buildFilters() {
  if (COURSES.length < 2) { filtersEl.hidden = true; return; }
  ["All", ...COURSES].forEach(name => {
    const b = el("button", { type: "button", "aria-pressed": name === active ? "true" : "false", text: name });
    b.addEventListener("click", () => {
      active = name;
      filtersEl.querySelectorAll("button").forEach(x =>
        x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      render();
    });
    filtersEl.appendChild(b);
  });
}

buildFilters();
PROJECTS.forEach((p, i) => grid.appendChild(buildCard(p, i)));
render();
window.addEventListener("resize", scalePreviews);
window.addEventListener("load", scalePreviews);
</script>
</body>
</html>
